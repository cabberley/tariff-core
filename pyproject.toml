[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "tariff-core"
dynamic = ["version"]
description = "Pure Python electricity, gas and water tariff modelling and evaluation."
requires-python = ">=3.13"
license = "MIT"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.2"]
dev = [
  "hatchling>=1.32.4",
  "hatch-vcs>=0.5.0",
  "PyYAML>=6.0.2",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.168.5",
]

[project.urls]
Documentation = "https://github.com/cabberley/tariff-core/blob/main/docs/schema.md"
Issues = "https://github.com/cabberley/tariff-core/issues"
Source = "https://github.com/cabberley/tariff-core"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_core"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["tariff_core"]
branch = true

[tool.coverage.report]
show_missing = true
